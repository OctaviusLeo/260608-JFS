# Test profile: replaces SQLite with an in-memory H2 database so the full
# Spring Boot context (including the JWT security filter chain) can load during
# automated tests without touching the persisted todo.db file.
spring.datasource.url=jdbc:h2:mem:todo-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop is safe here because the schema is rebuilt for the in-memory DB
# on every test run; it does NOT affect the production SQLite ddl-auto=update.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Valid Base64-encoded 256-bit key (matches application.properties so token
# parsing works identically in tests and production)
security.jwt.secret-key=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
security.jwt.expiration-time=3600000
