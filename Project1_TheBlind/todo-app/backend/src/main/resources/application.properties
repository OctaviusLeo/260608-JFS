spring.application.name=todo
spring.datasource.url=jdbc:sqlite:todo.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# secret key must be set via SECURITY_JWT_SECRET_KEY environment variable
security.jwt.secret-key=${SECURITY_JWT_SECRET_KEY}
# expiration time (1 hr in milliseconds), override with SECURITY_JWT_EXPIRATION_TIME
security.jwt.expiration-time=${SECURITY_JWT_EXPIRATION_TIME:3600000}