# How to run the app locally with Docker:
#   1. Copy backend/.env.example to backend/.env and fill in your values
#   2. From this folder run: docker compose up --build
#   3. Open http://localhost:4200 in your browser
#
# The Dockerfile compiles the app inside Docker so no local Gradle install is needed.
# The frontend is served by nginx on port 4200.
# The backend API is available directly on port 8080.
# nginx forwards any /api/ requests from the frontend to the backend container.
# The sqlite-data volume keeps the database file alive between restarts.

services:

  backend:
    build: ./backend
    container_name: todo-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SECURITY_JWT_SECRET_KEY: ${SECURITY_JWT_SECRET_KEY}
      SECURITY_JWT_EXPIRATION_TIME: ${SECURITY_JWT_EXPIRATION_TIME}
    volumes:
      - sqlite-data:/opt/app/data
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: todo-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  sqlite-data:
